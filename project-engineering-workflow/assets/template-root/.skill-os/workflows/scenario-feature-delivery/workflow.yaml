schema_version: "1.1.0"
template_id: "scenario.feature-delivery"
template_version: "1.0.0"
name: "Feature delivery"
kind: "scenario"
status: "approved"
entrypoints:
  task_types: [development, refactor, bugfix]
  required_inputs: [request]
  profile_conditions: {}
inputs:
  - name: request
    required: true
outputs:
  - name: delivery_summary
  - name: verification_report
composition:
  requires:
    - template_id: foundation.engineering-governance
      version: "^1.0.0"
skills:
  - skill_ref: project-profile-router
  - skill_ref: project-requirement-gate
  - skill_ref: project-scope-impact-guard
  - skill_ref: project-tech-solution
  - skill_ref: project-code-generation
  - skill_ref: project-code-review
  - skill_ref: project-verification-loop
  - skill_ref: project-test-and-report
nodes:
  - id: profile
    kind: skill
    skill_ref: project-profile-router
  - id: requirement-confirmation
    kind: approval_gate
  - id: impact
    kind: skill
    skill_ref: project-scope-impact-guard
  - id: technical-plan
    kind: skill
    skill_ref: project-tech-solution
  - id: implementation-approval
    kind: approval_gate
  - id: implementation
    kind: skill
    skill_ref: project-code-generation
  - id: code-review
    kind: skill
    skill_ref: project-code-review
  - id: verification
    kind: skill
    skill_ref: project-verification-loop
  - id: self-test-report
    kind: skill
    skill_ref: project-test-and-report
edges:
  - id: profile-to-requirement
    from: profile
    to: requirement-confirmation
  - id: requirement-to-impact
    from: requirement-confirmation
    to: impact
  - id: impact-to-plan
    from: impact
    to: technical-plan
  - id: plan-to-implementation-approval
    from: technical-plan
    to: implementation-approval
  - id: implementation-approval-to-implementation
    from: implementation-approval
    to: implementation
  - id: implementation-to-review
    from: implementation
    to: code-review
  - id: review-to-verification
    from: code-review
    to: verification
  - id: verification-to-report
    from: verification
    to: self-test-report
quality_gate:
  score_policy_ref: "quality.feature-delivery.v1"
  pass_score: 90
  dimension_floors:
    coverage: 75
    correctness: 75
    verification: 75
    maintainability: 70
  required_checks:
    - no_blocking_issue
    - evidence_for_all_confirmed_acceptance
    - impact_scope_self_check
loop_policy:
  enabled: true
  max_iterations: 3
  max_same_root_cause_strategies: 2
  on_scope_change: "require_reconfirmation"
  on_budget_exhausted: "needs_user_decision"
permissions:
  capabilities: [read_project, write_project_after_confirmation]
compatibility:
  core: ">=0.8.0 <1.0.0"
  manifest_schema: ">=1.1.0 <2.0.0"
