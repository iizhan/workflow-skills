schema_version: "1.1.0"
template_id: "integration.swagger-to-frontend"
template_version: "1.0.0"
name: "Swagger to frontend integration"
kind: "integration"
status: "approved"
entrypoints:
  task_types: [development]
  required_inputs: [request, api_contract, frontend_surface]
  profile_conditions:
    surfaces: [frontend, backend]
inputs:
  - name: request
    required: true
  - name: api_contract
    required: true
  - name: frontend_surface
    required: true
outputs:
  - name: integration_delivery
  - name: verification_report
composition:
  requires:
    - template_id: foundation.engineering-governance
      version: "^1.0.0"
    - template_id: role.frontend-engineering
      version: "^1.0.0"
    - template_id: role.backend-engineering
      version: "^1.0.0"
skills:
  - skill_ref: project-profile-router
  - skill_ref: project-tech-solution
  - skill_ref: project-frontend-standards
  - skill_ref: project-backend-standards
  - skill_ref: project-code-generation
  - skill_ref: project-verification-loop
  - skill_ref: project-test-and-report
nodes:
  - id: contract-baseline
    kind: checkpoint
  - id: integration-plan
    kind: skill
    skill_ref: project-tech-solution
  - id: frontend-implementation
    kind: skill
    skill_ref: project-code-generation
  - id: contract-verification
    kind: skill
    skill_ref: project-verification-loop
  - id: self-test-report
    kind: skill
    skill_ref: project-test-and-report
edges:
  - id: contract-to-plan
    from: contract-baseline
    to: integration-plan
  - id: plan-to-frontend-implementation
    from: integration-plan
    to: frontend-implementation
  - id: frontend-implementation-to-contract-verification
    from: frontend-implementation
    to: contract-verification
  - id: contract-verification-to-self-test-report
    from: contract-verification
    to: self-test-report
quality_gate:
  score_policy_ref: "quality.swagger-integration.v1"
  pass_score: 90
  dimension_floors:
    coverage: 75
    correctness: 75
    contract: 80
    verification: 75
  required_checks:
    - no_blocking_issue
    - evidence_for_all_confirmed_acceptance
    - api_contract_evidence
    - key_path_integration_evidence
loop_policy:
  enabled: true
  max_iterations: 3
  max_same_root_cause_strategies: 2
  on_scope_change: "require_reconfirmation"
  on_budget_exhausted: "needs_user_decision"
permissions:
  capabilities: [read_project, read_api_contract, write_project_after_confirmation]
compatibility:
  core: ">=0.8.0 <1.0.0"
  manifest_schema: ">=1.1.0 <2.0.0"
